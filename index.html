<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Lokus</title>
<meta name="description" content="Die nächste Toilette, schnell gefunden.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lokus">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14120f">
<script>try{var t=localStorage.getItem("lk_theme");if(t)document.documentElement.dataset.theme=JSON.parse(t);if(JSON.parse(localStorage.getItem("lk_big")||"false"))document.documentElement.classList.add("big")}catch(e){}</script>
<link rel="stylesheet" href="vendor/leaflet.css?v=1.9.4">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div class="app">
  <header>
    <h1 class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--accent)"/><path d="M10 7h4v8h9a1 1 0 0 1 1 1c0 4-3 7.2-7 7.8V26h-7v-4.4C8 20.3 7 18.5 7 16a1 1 0 0 1 1-1h2z" fill="var(--accentInk)"/></svg>Lokus</h1>
    <button class="ibtn" id="sizeBtn" title="Schrift größer oder kleiner" aria-label="Schrift größer">A+</button>
    <button class="ibtn" id="themeBtn" title="Hell oder dunkel" aria-label="Hell oder dunkel"></button>
  </header>

  <div class="mapwrap">
    <div id="map" role="application" aria-label="Karte mit Toiletten"></div>
    <div class="mapbar">
      <button class="ibtn" id="locBtn" title="Zu meinem Standort" aria-label="Zu meinem Standort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button class="ibtn" id="refreshBtn" title="Diesen Ausschnitt jetzt bei OpenStreetMap aktualisieren" aria-label="Aktualisieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button class="ibtn" id="moreBtn" title="Weitere Klos ein- oder ausblenden (Café, Kaufhaus, Bahnhof …)" aria-label="Weitere Klos" aria-pressed="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 7h13v6a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6zM17 9h1.5a2.5 2.5 0 0 1 0 5H17" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M4 7h13v6a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/></svg></button>
    </div>
    <div class="legend"><span><i style="background:var(--free)"></i>kostenlos</span><span><i style="background:var(--paid)"></i>kostet</span><span><i style="background:var(--unk)"></i>Preis unklar</span><span><i style="background:var(--more)"></i>Weitere Klos</span></div>
  </div>

  <div class="chips" id="chips" role="group" aria-label="Filter"></div>

  <main id="main">
    <div id="banner" hidden></div>
    <section class="sheet" id="sheet" aria-live="polite"><p class="empty">Lade Toiletten …</p></section>
  </main>

  <div class="foot">
    <span id="ver"></span>
    <span class="links"><button id="wishBtn">Wunsch / Feedback</button><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">Daten © OpenStreetMap-Mitwirkende</a></span>
  </div>
</div>
<script src="vendor/leaflet.js?v=1.9.4"></script>
<script src="config.js?v=1"></script>
<script src="oh.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
