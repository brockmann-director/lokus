<div class="app">
  <header>
    <h1 class="logo"><svg viewBox="76 40 360 400" aria-hidden="true"><path d="M-55.0,-125.0 H55.0 A70,70 0 0 1 125.0,-55.0 V55.0 A70,70 0 0 1 55.0,125.0 H-113.0 A12,12 0 0 1 -125.0,113.0 V-55.0 A70,70 0 0 1 -55.0,-125.0 Z" transform="translate(256,232) rotate(-45)" fill="var(--accent)" stroke="none" stroke-width="0"/><path d="M6 3h4v7h9a1 1 0 0 1 1 1c0 3.5-2.4 6.2-6 6.9V21H8v-4.3C5.6 15.6 4 13.4 4 11a1 1 0 0 1 1-1h1z" fill="#fff" transform="translate(140.8,112.80000000000001) scale(9.6)"/></svg>Lokus<small class="build">1.2 · Build __BUILD__</small></h1>

  <div class="mapwrap">
    <div id="map" role="application" aria-label="Karte mit Toiletten"></div>
    <div class="mapbar">
      <button class="ibtn" id="locBtn" title="Zu meinem Standort" aria-label="Zu meinem Standort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button class="ibtn" id="refreshBtn" title="Diesen Ausschnitt jetzt bei OpenStreetMap aktualisieren" aria-label="Aktualisieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button class="ibtn" id="moreBtn" title="Weitere Klos ein- oder ausblenden (Café, Kaufhaus, Bahnhof …)" aria-label="Weitere Klos" aria-pressed="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 7h13v6a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6zM17 9h1.5a2.5 2.5 0 0 1 0 5H17" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M4 7h13v6a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/></svg></button>
    </div>
    <div class="legend"><span><i style="background:var(--free)"></i>kostenlos</span><span><i style="background:var(--paid)"></i>kostet</span><span><i style="background:var(--unk)"></i>Preis unklar</span><span><i style="background:var(--more)"></i>Weitere Klos</span></div>
  </div>

  <div class="chips" id="chips" role="group" aria-label="Filter"></div>

  <main id="main">
    <div id="banner" hidden></div>
    <section class="sheet" id="sheet" aria-live="polite"><p class="empty">Lade Toiletten …</p></section>
  </main>

  <div class="foot">
    <span id="ver"></span>
    <span class="links"><button id="wishBtn">Wunsch / Feedback</button><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">Daten © OpenStreetMap-Mitwirkende</a></span>
  </div>
</div>
