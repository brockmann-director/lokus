name: Seite und Daten

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 0"   # sonntags früh: Toiletten-Daten neu holen
  workflow_dispatch:
    inputs:
      fresh:
        description: "Daten neu von OpenStreetMap holen"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html app.js oh.js style.css sw.js config.js manifest.webmanifest CNAME icon.svg icon-192.png icon-512.png icon-512-any.png apple-touch-icon.png vendor _site/
      - name: Toiletten-Daten
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.fresh }}" = "false" ]; then
            python3 tools/fetch_osm.py _site --fallback https://lokus.thisisjan.com --reuse
          else
            python3 tools/fetch_osm.py _site --fallback https://lokus.thisisjan.com
          fi
          cat _site/data/index.json | head -c 400
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
